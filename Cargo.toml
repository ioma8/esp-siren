[package]
name = "esp-siren"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
esp-backtrace = { version = "0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "1.1.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["uart"] }

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
